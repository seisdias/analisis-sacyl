name: Build macOS M1 export

on:
  push:
    branches:
      - build/mac-m1-export-20260917
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-webview.txt

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          test "$(uname -m)" = "arm64"
          python3 --version
          python3 -c 'import platform; print(platform.machine())'

      - name: Build macOS application
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Verify application bundle
        shell: bash
        run: |
          set -euxo pipefail
          test -d dist/salud_v1.app
          test -f dist/salud_v1.app/Contents/MacOS/salud_v1
          test -f dist/salud_v1.app/Contents/Resources/web/shell.html
          test -f dist/salud_v1.app/Contents/Resources/web/dashboard.html
          test -f dist/salud_v1.app/Contents/Resources/web/assets/app.js
          file dist/salud_v1.app/Contents/MacOS/salud_v1
          file dist/salud_v1.app/Contents/MacOS/salud_v1 | grep -q arm64

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/salud_v1.app/Contents/MacOS/salud_v1"
          "$BIN" > mac-runtime-smoke.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/web/shell.html" >/dev/null; then
              OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ "$OK" -ne 1 ]; then
            cat mac-runtime-smoke.log || true
            exit 1
          fi
          echo "Runtime smoke test OK"

      - name: Package application and source for pendrive
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main feature/mac-os-tahoe
          MAIN_SHA="$(git rev-parse origin/main)"
          MAC_SHA="$(git rev-parse origin/feature/mac-os-tahoe)"
          git archive --format=zip --prefix=analisis-sacyl-main/ -o AnalisisSACYL-main-source.zip origin/main
          git archive --format=zip --prefix=analisis-sacyl-mac-os-tahoe/ -o AnalisisSACYL-mac-os-tahoe-source.zip origin/feature/mac-os-tahoe
          printf 'Mac source branch: feature/mac-os-tahoe\nMac source commit: %s\nWindows source branch: main\nWindows source commit: %s\nBuild runner: macos-15 arm64\nPython: 3.12\n' "$MAC_SHA" "$MAIN_SHA" > BUILD_INFO.txt
          ditto -c -k --sequesterRsrc --keepParent dist/salud_v1.app AnalisisSACYL-macOS-M1.zip
          shasum -a 256 AnalisisSACYL-macOS-M1.zip AnalisisSACYL-main-source.zip AnalisisSACYL-mac-os-tahoe-source.zip > SHA256SUMS.txt

      - name: Upload portable macOS package
        uses: actions/upload-artifact@v4
        with:
          name: AnalisisSACYL-macOS-M1
          path: |
            AnalisisSACYL-macOS-M1.zip
            AnalisisSACYL-main-source.zip
            AnalisisSACYL-mac-os-tahoe-source.zip
            SHA256SUMS.txt
            BUILD_INFO.txt
            mac-runtime-smoke.log
          if-no-files-found: error
