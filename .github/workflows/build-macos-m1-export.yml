name: Build macOS M1 export

on:
  push:
    branches:
      - build/mac-m1-export-20260917
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-webview.txt

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          test "$(uname -m)" = "arm64"
          python3 --version
          python3 -c 'import platform; print(platform.machine())'

      - name: Build macOS application
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Verify application bundle
        shell: bash
        run: |
          set -euxo pipefail
          test -d dist/salud_v1.app
          test -f dist/salud_v1.app/Contents/MacOS/salud_v1
          test -f dist/salud_v1.app/Contents/Resources/web/shell.html
          test -f dist/salud_v1.app/Contents/Resources/web/dashboard.html
          test -f dist/salud_v1.app/Contents/Resources/web/assets/app.js
          file dist/salud_v1.app/Contents/MacOS/salud_v1
          file dist/salud_v1.app/Contents/MacOS/salud_v1 | grep -q arm64

      - name: Package application for pendrive
        shell: bash
        run: |
          set -euxo pipefail
          printf 'Source branch: feature/mac-os-tahoe\nSource commit: %s\nBuild runner: macos-15 arm64\nPython: 3.12\n' "${GITHUB_SHA}" > BUILD_INFO.txt
          ditto -c -k --sequesterRsrc --keepParent dist/salud_v1.app AnalisisSACYL-macOS-M1.zip
          shasum -a 256 AnalisisSACYL-macOS-M1.zip > AnalisisSACYL-macOS-M1.zip.sha256

      - name: Upload portable macOS package
        uses: actions/upload-artifact@v4
        with:
          name: AnalisisSACYL-macOS-M1
          path: |
            AnalisisSACYL-macOS-M1.zip
            AnalisisSACYL-macOS-M1.zip.sha256
            BUILD_INFO.txt
          if-no-files-found: error
