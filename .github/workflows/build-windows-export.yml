name: Build Windows export

on:
  push:
    branches:
      - build/windows-export-20260917
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-webview.txt
            requirements-build.txt

      - name: Verify x64 runner
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.machine())"
          if ([System.Environment]::Is64BitOperatingSystem -ne $true) { throw "Windows no es x64" }

      - name: Install runtime, tests, desktop, and build profiles
        shell: bash
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-webview.txt -r requirements-build.txt

      - name: Run focused runtime and packaging tests
        shell: bash
        run: python -m pytest -q tests/test_runtime_paths.py tests/test_web_main_runtime.py tests/test_js_bridge_runtime.py tests/test_requirements_profiles.py tests/test_offline_build_packaging.py

      - name: Build and smoke-test executable
        shell: bash
        run: bash scripts/build_windows.sh

      - name: Re-run executable smoke test
        shell: bash
        run: timeout 30s dist/AnalisisSACYL/AnalisisSACYL.exe --smoke-test

      - name: Reject forbidden artifact content
        shell: pwsh
        run: |
          $root = (Resolve-Path "dist/AnalisisSACYL").Path
          $forbiddenDirs = Get-ChildItem $root -Recurse -Directory | Where-Object { $_.Name -match '^(tests?|data|uploads?|backups?|htmlcov)$' }
          $forbiddenFiles = Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -match '^\.(pdf|db|sqlite|sqlite3)$' -or $_.Name -match '(-wal|-shm)$' }
          if ($forbiddenDirs -or $forbiddenFiles) {
            $forbiddenDirs.FullName
            $forbiddenFiles.FullName
            throw "El artefacto contiene datos o recursos prohibidos."
          }

      - name: Add Windows launchers and diagnostics
        shell: pwsh
        run: |
          $root = "dist/AnalisisSACYL"

          @'
          @echo off
          cd /d "%~dp0"
          start "" "AnalisisSACYL.exe"
          '@ | Set-Content -Encoding ASCII "$root/INICIAR_ANALISISSACYL.bat"

          @'
          @echo off
          cd /d "%~dp0"
          start "" "AnalisisSACYL.exe" --browser
          '@ | Set-Content -Encoding ASCII "$root/INICIAR_EN_NAVEGADOR.bat"

          @'
          @echo off
          cd /d "%~dp0"
          echo Probando backend y recursos de AnalisisSACYL...
          AnalisisSACYL.exe --smoke-test
          if errorlevel 1 (
            echo.
            echo ERROR: el smoke test ha fallado en este PC.
          ) else (
            echo.
            echo OK: backend y recursos funcionan correctamente en este PC.
          )
          echo.
          pause
          '@ | Set-Content -Encoding ASCII "$root/DIAGNOSTICO_WINDOWS.bat"

          @'
          @echo off
          taskkill /IM AnalisisSACYL.exe /F >nul 2>&1
          exit /b 0
          '@ | Set-Content -Encoding ASCII "$root/CERRAR_ANALISISSACYL.bat"

          @'
          ANALISISSACYL WINDOWS PORTABLE
          ==============================

          1. Descomprime TODO el ZIP antes de ejecutar.
          2. Ejecuta INICIAR_ANALISISSACYL.bat.
          3. Si no aparece la ventana, ejecuta INICIAR_EN_NAVEGADOR.bat.
          4. DIAGNOSTICO_WINDOWS.bat comprueba backend y recursos en el PC real.
          5. CERRAR_ANALISISSACYL.bat termina cualquier proceso que quede en segundo plano.

          No se necesita Python ni PyCharm en el PC destino.
          '@ | Set-Content -Encoding UTF8 "$root/LEEME_WINDOWS.txt"

      - name: Record source version
        shell: bash
        run: |
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          printf 'Windows source branch: main\nWindows source commit: %s\nPackaging branch commit: %s\nBuild runner: windows-latest x64\nPython: 3.12\nPortable fallback: any desktop GUI exception -> system browser\n' "$MAIN_SHA" "$GITHUB_SHA" > BUILD_INFO_WINDOWS.txt
          cp BUILD_INFO_WINDOWS.txt dist/AnalisisSACYL/BUILD_INFO_WINDOWS.txt

      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AnalisisSACYL-windows-current
          path: dist/AnalisisSACYL/
          if-no-files-found: error
