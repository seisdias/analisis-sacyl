name: Build Windows export

on:
  push:
    branches:
      - build/windows-export-20260917
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-webview.txt
            requirements-build.txt

      - name: Verify x64 runner
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.machine())"
          if ([System.Environment]::Is64BitOperatingSystem -ne $true) { throw "Windows no es x64" }

      - name: Install runtime, tests, desktop, and build profiles
        shell: bash
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-webview.txt -r requirements-build.txt

      - name: Run focused runtime and packaging tests
        shell: bash
        run: python -m pytest -q tests/test_runtime_paths.py tests/test_web_main_runtime.py tests/test_js_bridge_runtime.py tests/test_requirements_profiles.py tests/test_offline_build_packaging.py

      - name: Build standard desktop executable
        shell: bash
        run: bash scripts/build_windows.sh

      - name: Build browser-only and console-diagnostic executables
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist-browser --workpath build-browser AnalisisSACYL-Browser.spec
          python -m PyInstaller --noconfirm --clean --distpath dist-diagnostic --workpath build-diagnostic AnalisisSACYL-Diagnostico.spec

      - name: Smoke-test all three packages
        shell: bash
        run: |
          timeout 30s dist/AnalisisSACYL/AnalisisSACYL.exe --smoke-test
          timeout 30s dist-browser/AnalisisSACYL-Browser/AnalisisSACYL-Browser.exe --smoke-test
          timeout 30s dist-diagnostic/AnalisisSACYL-Diagnostico/AnalisisSACYL-Diagnostico.exe --smoke-test

      - name: Assemble V3 portable package
        shell: pwsh
        run: |
          $pkg = "package/AnalisisSACYL-Windows-V3"
          New-Item -ItemType Directory -Force "$pkg/DESKTOP" | Out-Null
          New-Item -ItemType Directory -Force "$pkg/BROWSER" | Out-Null
          New-Item -ItemType Directory -Force "$pkg/DIAGNOSTICO" | Out-Null

          Copy-Item "dist/AnalisisSACYL/*" "$pkg/DESKTOP/" -Recurse -Force
          Copy-Item "dist-browser/AnalisisSACYL-Browser/*" "$pkg/BROWSER/" -Recurse -Force
          Copy-Item "dist-diagnostic/AnalisisSACYL-Diagnostico/*" "$pkg/DIAGNOSTICO/" -Recurse -Force

          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0BROWSER\AnalisisSACYL-Browser.exe"
          '@ | Set-Content -Encoding ASCII "$pkg/INICIAR_ANALISISSACYL.bat"

          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0DESKTOP\AnalisisSACYL.exe"
          '@ | Set-Content -Encoding ASCII "$pkg/INICIAR_DESKTOP_NATIVO.bat"

          @'
          @echo off
          cd /d "%~dp0"
          set LOG=%~dp0DIAGNOSTICO_LOG.txt
          echo === AnalisisSACYL Windows V3 === > "%LOG%"
          echo Fecha: %DATE% %TIME% >> "%LOG%"
          echo Arquitectura: %PROCESSOR_ARCHITECTURE% >> "%LOG%"
          echo Windows: >> "%LOG%"
          ver >> "%LOG%" 2>&1
          echo. >> "%LOG%"
          echo Ejecutando smoke test con consola... >> "%LOG%"
          "%~dp0DIAGNOSTICO\AnalisisSACYL-Diagnostico.exe" --smoke-test >> "%LOG%" 2>&1
          set CODE=%ERRORLEVEL%
          echo. >> "%LOG%"
          echo Exit code: %CODE% >> "%LOG%"
          type "%LOG%"
          echo.
          echo El informe se ha guardado en:
          echo %LOG%
          echo.
          pause
          exit /b %CODE%
          '@ | Set-Content -Encoding ASCII "$pkg/DIAGNOSTICO_COMPLETO.bat"

          @'
          @echo off
          taskkill /IM AnalisisSACYL.exe /F >nul 2>&1
          taskkill /IM AnalisisSACYL-Browser.exe /F >nul 2>&1
          taskkill /IM AnalisisSACYL-Diagnostico.exe /F >nul 2>&1
          exit /b 0
          '@ | Set-Content -Encoding ASCII "$pkg/CERRAR_ANALISISSACYL.bat"

          @'
          ANALISISSACYL WINDOWS PORTABLE V3
          =================================

          PRIMERA PRUEBA EN WINDOWS 11
          1. Descomprime TODO el ZIP en una carpeta local (por ejemplo C:\AnalisisSACYL-V3).
          2. Ejecuta INICIAR_ANALISISSACYL.bat. Esta es la variante recomendada: abre la UI en el navegador y NO usa pywebview.
          3. Si quieres probar la ventana nativa, ejecuta INICIAR_DESKTOP_NATIVO.bat.
          4. Si cualquiera falla, ejecuta DIAGNOSTICO_COMPLETO.bat.
          5. DIAGNOSTICO_COMPLETO.bat crea DIAGNOSTICO_LOG.txt con el error real y el exit code.

          No se necesita Python ni PyCharm en el PC destino.
          No ejecutes desde dentro del ZIP: descomprime todo antes.
          '@ | Set-Content -Encoding UTF8 "$pkg/LEEME_PRIMERO.txt"

      - name: Reject forbidden content in V3 package
        shell: pwsh
        run: |
          $root = (Resolve-Path "package/AnalisisSACYL-Windows-V3").Path
          $forbiddenDirs = Get-ChildItem $root -Recurse -Directory | Where-Object { $_.Name -match '^(tests?|data|uploads?|backups?|htmlcov)$' }
          $forbiddenFiles = Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -match '^\.(pdf|db|sqlite|sqlite3)$' -or $_.Name -match '(-wal|-shm)$' }
          if ($forbiddenDirs -or $forbiddenFiles) {
            $forbiddenDirs.FullName
            $forbiddenFiles.FullName
            throw "El artefacto contiene datos o recursos prohibidos."
          }

      - name: Record source version
        shell: bash
        run: |
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          printf 'Windows source branch: main\nWindows source commit: %s\nPackaging branch commit: %s\nBuild runner: windows-latest x64\nPython: 3.12\nV3 includes: browser-only + desktop pywebview + console diagnostic\n' "$MAIN_SHA" "$GITHUB_SHA" > package/AnalisisSACYL-Windows-V3/BUILD_INFO_WINDOWS.txt

      - name: Upload Windows V3 portable package
        uses: actions/upload-artifact@v4
        with:
          name: AnalisisSACYL-windows-v3
          path: package/AnalisisSACYL-Windows-V3/
          if-no-files-found: error
